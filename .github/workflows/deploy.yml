name: Deploy

# Builds the API and dashboard images for a commit that passed CI on main, pushes them to
# GitHub's container registry and restarts the stack on the server (deploy/compose.yml).
# Stays off until the repository variable DEPLOY_HOST is set.
#
# Repository variables: DEPLOY_HOST (server IP), APP_DOMAIN (e.g. app.yaropay.com), DEPLOY_USER (default: deploy)
# Repository secrets:   DEPLOY_SSH_KEY (private key of the `deploy` user), DEPLOY_KNOWN_HOSTS (the server's host keys),
#                       EE_DEPLOY_KEY (read-only deploy key of the private yaropay-ee repository)
#
# Server settings: a secret or variable named ENV_<KEY> (on the repository or its `production`
# environment), for each key listed in the "Apply server settings from GitHub" step, is merged into the
# server's .env as <KEY> before the restart, so settings change without SSH: edit it on GitHub, then
# Actions -> Deploy -> Run workflow. See "Changing server settings from GitHub" in the README.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (leave empty for the latest main). Use an older commit to roll back.
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/round24consult/yaropay
  SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Build and push images
    if: vars.DEPLOY_HOST != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      # app.yaropay.com runs the paid build; the dashboard image doesn't need it.
      - if: matrix.app == 'api'
        uses: ./.github/actions/checkout-ee
        with:
          ssh-key: ${{ secrets.EE_DEPLOY_KEY }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # The API build fails if the paid code is missing, rather than shipping Community by accident.
          build-args: ${{ matrix.app == 'api' && 'EDITION=enterprise' || '' }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ env.SHA }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
          # Links the package to this repository, so the deploy job's token can pull it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Restart the stack on the server
    needs: images
    runs-on: ubuntu-latest
    # Settings for the server (ENV_* secrets and variables) can live on this environment.
    environment: production
    timeout-minutes: 15
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - name: SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy stack files
        run: scp -q deploy/compose.yml deploy/Caddyfile deploy/apply-env.py "$DEPLOY_USER@$HOST:/opt/yaropay/"
      - name: Back up the database
        run: |
          ssh "$DEPLOY_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/yaropay
          # A backup right before every deploy, so a migration can always be undone. Keeps the last 10.
          # (`< /dev/null`: this script itself arrives on stdin, and `exec` would swallow the rest of it.)
          if docker compose ps --status running --services | grep -qx postgres; then
            docker compose exec -T postgres pg_dump -U yaropay -Fc yaropay > "backups/pre-deploy-$(date -u +%Y%m%d-%H%M%S).dump" < /dev/null
            ls -1t backups/pre-deploy-*.dump 2>/dev/null | tail -n +11 | xargs -r rm -f
          fi
          REMOTE
      - name: Apply server settings from GitHub
        # One line per setting the hosted stack reads: ENV_<KEY> as a secret or a variable (the secret wins).
        # To support another key, add it here. Keys that must never change this way are left out and
        # also refused by apply-env.py.
        env:
          ENV_APP_DOMAIN: ${{ secrets.ENV_APP_DOMAIN || vars.ENV_APP_DOMAIN }}
          ENV_SITE_DOMAIN: ${{ secrets.ENV_SITE_DOMAIN || vars.ENV_SITE_DOMAIN }}
          ENV_YAROPAY_CLOUD: ${{ secrets.ENV_YAROPAY_CLOUD || vars.ENV_YAROPAY_CLOUD }}
          ENV_YAROPAY_DISABLE_EE: ${{ secrets.ENV_YAROPAY_DISABLE_EE || vars.ENV_YAROPAY_DISABLE_EE }}
          ENV_SETUP_TOKEN: ${{ secrets.ENV_SETUP_TOKEN || vars.ENV_SETUP_TOKEN }}
          ENV_YAROPAY_ENCRYPTION_KEY_PREVIOUS: ${{ secrets.ENV_YAROPAY_ENCRYPTION_KEY_PREVIOUS || vars.ENV_YAROPAY_ENCRYPTION_KEY_PREVIOUS }}
          ENV_SMTP_URL: ${{ secrets.ENV_SMTP_URL || vars.ENV_SMTP_URL }}
          ENV_MAIL_FROM: ${{ secrets.ENV_MAIL_FROM || vars.ENV_MAIL_FROM }}
          ENV_BILLING_PAYSTACK_SECRET_KEY: ${{ secrets.ENV_BILLING_PAYSTACK_SECRET_KEY || vars.ENV_BILLING_PAYSTACK_SECRET_KEY }}
          ENV_LOG_LEVEL: ${{ secrets.ENV_LOG_LEVEL || vars.ENV_LOG_LEVEL }}
          ENV_SESSION_DAYS: ${{ secrets.ENV_SESSION_DAYS || vars.ENV_SESSION_DAYS }}
          ENV_PASSWORD_HASH_COST: ${{ secrets.ENV_PASSWORD_HASH_COST || vars.ENV_PASSWORD_HASH_COST }}
          ENV_RATE_LIMIT: ${{ secrets.ENV_RATE_LIMIT || vars.ENV_RATE_LIMIT }}
          ENV_V1_RATE_LIMIT_PER_MINUTE: ${{ secrets.ENV_V1_RATE_LIMIT_PER_MINUTE || vars.ENV_V1_RATE_LIMIT_PER_MINUTE }}
          ENV_CORS_ORIGINS: ${{ secrets.ENV_CORS_ORIGINS || vars.ENV_CORS_ORIGINS }}
          ENV_GATEWAY_TIMEOUT_MS: ${{ secrets.ENV_GATEWAY_TIMEOUT_MS || vars.ENV_GATEWAY_TIMEOUT_MS }}
          ENV_WEBHOOK_TIMEOUT_MS: ${{ secrets.ENV_WEBHOOK_TIMEOUT_MS || vars.ENV_WEBHOOK_TIMEOUT_MS }}
          ENV_WEBHOOK_ALLOW_PRIVATE: ${{ secrets.ENV_WEBHOOK_ALLOW_PRIVATE || vars.ENV_WEBHOOK_ALLOW_PRIVATE }}
          ENV_WORKERS: ${{ secrets.ENV_WORKERS || vars.ENV_WORKERS }}
          ENV_WORKER_INTERVAL_MS: ${{ secrets.ENV_WORKER_INTERVAL_MS || vars.ENV_WORKER_INTERVAL_MS }}
          ENV_DB_MIGRATE_ON_START: ${{ secrets.ENV_DB_MIGRATE_ON_START || vars.ENV_DB_MIGRATE_ON_START }}
          ENV_BACKUP_KEEP_DAYS: ${{ secrets.ENV_BACKUP_KEEP_DAYS || vars.ENV_BACKUP_KEEP_DAYS }}
        run: |
          set -o pipefail
          # Settings that are set become <KEY> in the server's .env. Values travel on stdin only (never in a
          # command line or the log), and apply-env.py prints key names only.
          jq -nc 'env | with_entries(select((.key | startswith("ENV_")) and .value != "") | .key |= ltrimstr("ENV_"))' \
            | ssh "$DEPLOY_USER@$HOST" 'python3 /opt/yaropay/apply-env.py /opt/yaropay/.env'
      - name: Pull images and restart
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          # The workflow token is short-lived: log in, pull, log out.
          printf '%s' "$REGISTRY_TOKEN" | ssh "$DEPLOY_USER@$HOST" "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin" >/dev/null
          ssh "$DEPLOY_USER@$HOST" API_IMAGE="$IMAGE_PREFIX-api:$SHA" WEB_IMAGE="$IMAGE_PREFIX-web:$SHA" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/yaropay
          # Record the deployed images in .env, so `docker compose` works by hand on the server too.
          sed -i '/^API_IMAGE=/d;/^WEB_IMAGE=/d' .env
          printf 'API_IMAGE=%s\nWEB_IMAGE=%s\n' "$API_IMAGE" "$WEB_IMAGE" >> .env
          docker compose pull --quiet
          docker compose up -d --remove-orphans --wait --wait-timeout 180
          # Apply Caddyfile changes even when the Caddy container itself didn't change.
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile < /dev/null
          docker logout ghcr.io >/dev/null
          docker image prune -f >/dev/null
          docker compose ps --format 'table {{.Service}}\t{{.Status}}'
          REMOTE
      - name: Check the app and the website answer
        if: env.APP_DOMAIN != ''
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors -o /dev/null -w "https://$APP_DOMAIN/login answered %{http_code}\n" "https://$APP_DOMAIN/login"
          if [ -n "$SITE_DOMAIN" ]; then
            curl -fsS --retry 12 --retry-delay 5 --retry-all-errors -o /dev/null -w "https://$SITE_DOMAIN/docs answered %{http_code}\n" "https://$SITE_DOMAIN/docs"
          fi
