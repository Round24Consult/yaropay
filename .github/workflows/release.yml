name: Release

# Publishes the Community edition's Docker images to Docker Hub when a version tag is pushed
# (git tag v0.1.0 && git push origin v0.1.0). Images are built from this repository alone, so they never
# contain paid code. Needs the repository variable DOCKERHUB_NAMESPACE (e.g. yaropay) and the secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token with read and write access).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish without the leading v (e.g. 0.1.0). Leave empty to publish only "edge".
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  images:
    name: Docker Hub (${{ matrix.app }})
    if: vars.DOCKERHUB_NAMESPACE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Tags
        id: tags
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          image="docker.io/$NAMESPACE/${{ matrix.app }}"
          if [ "$REF_TYPE" = "tag" ]; then version="${REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          if [ -n "$version" ]; then
            printf 'tags=%s:%s,%s:latest\n' "$image" "$version" "$image" >> "$GITHUB_OUTPUT"
          else
            printf 'tags=%s:edge\n' "$image" >> "$GITHUB_OUTPUT"
          fi
          printf 'version=%s\n' "${version:-edge}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=YaroPay ${{ matrix.app }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.url=https://yaropay.com
            org.opencontainers.image.documentation=https://yaropay.com/docs/self-hosting
          cache-from: type=gha,scope=release-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.app }}
