name: Release

# Publishes a YaroPay Community release when a version tag is pushed:
#   1. checks the tag matches the version in package.json,
#   2. builds the API and dashboard images for linux/amd64 and linux/arm64 and pushes them to
#      ghcr.io/round24consult/yaropay/{api,web} as X.Y.Z, X.Y and latest,
#   3. creates the GitHub Release, with notes generated from the pull requests merged since the previous
#      release (grouped by label, see .github/release.yml).
# Images are built from this repository alone, so they never contain paid code.
# How to cut a release is in CONTRIBUTING.md. workflow_dispatch publishes an "edge" build of main.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then echo "version=edge" >> "$GITHUB_OUTPUT"; exit 0; fi
          tag="${REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $REF_NAME doesn't match package.json version $pkg. Bump the version in a pull request first."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  images:
    name: Images (${{ matrix.app }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Tags
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/round24consult/yaropay/${{ matrix.app }}"
          if [ "$VERSION" = "edge" ]; then
            printf 'tags=%s:edge\n' "$image" >> "$GITHUB_OUTPUT"
          else
            printf 'tags=%s:%s,%s:%s,%s:latest\n' "$image" "$VERSION" "$image" "${VERSION%.*}" "$image" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=YaroPay ${{ matrix.app }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/Round24Consult/yaropay
            org.opencontainers.image.url=https://yaropay.com
            org.opencontainers.image.documentation=https://yaropay.com/docs/self-hosting
          cache-from: type=gha,scope=release-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.app }}

  release:
    name: GitHub Release
    needs: [version, images]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "YaroPay $VERSION"
