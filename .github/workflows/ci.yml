name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  checks:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Core unit tests and the API suite (in-memory PGlite, fake Paystack/Flutterwave).
      - run: npm test

  # The paid build (private yaropay-ee, mounted at apps/api/src/ee). Every other job runs without it,
  # which proves the open-source app builds and passes on its own.
  paid:
    name: Paid build (yaropay-ee)
    # Needs the deploy key, which pull requests from forks never get.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-ee
        with:
          ssh-key: ${{ secrets.EE_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run typecheck -w @yaropay/api
      # The API suite plus the paid build's own tests (src/ee/**/*.test.ts).
      - run: npm test -w @yaropay/api
      - name: The build includes the paid code
        run: npm run build -w @yaropay/api && test -f apps/api/dist/ee/index.js

  postgres:
    name: API tests on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yaropay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run test:pg -w @yaropay/api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yaropay_test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:core
      # Uses the Google Chrome preinstalled on GitHub's Ubuntu runners (channel: "chrome").
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  docker:
    name: Docker images
    # On pull requests too (nothing is pushed), so a broken image blocks the merge instead of the deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
